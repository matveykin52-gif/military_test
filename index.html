<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курс подготовки</title>
    <style>
        :root { 
            --bg-color: #2c3e50; --card-bg: #ffffff; --text-main: #333333; 
            --primary: #4a6741; --primary-hover: #3b5334; --correct: #27ae60; 
            --wrong: #e74c3c; --border: #ccc; --selected: #f39c12;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); color: var(--text-main); 
            margin: 0; padding: 20px; display: flex; justify-content: center; 
            min-height: 100vh; 
        }
        .container { width: 100%; max-width: 800px; }
        header { text-align: center; color: white; margin-bottom: 20px; }
        header h1 { font-size: 24px; margin-bottom: 5px; }
        .menu { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .menu button { 
            background-color: var(--card-bg); border: none; padding: 10px 20px; 
            border-radius: 5px; cursor: pointer; font-weight: bold; 
            color: var(--text-main); transition: all 0.3s; font-size: 15px; 
        }
        .menu button.active { background-color: var(--primary); color: white; }
        .menu button:hover { opacity: 0.9; transform: translateY(-2px); }
        
        #app { 
            background-color: var(--card-bg); padding: 25px; border-radius: 10px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); min-height: 400px; 
            display: flex; flex-direction: column; justify-content: center; 
        }
        .question-text { font-size: 18px; font-weight: bold; margin-bottom: 15px; line-height: 1.4; }
        .question-image { max-width: 100%; max-height: 400px; object-fit: contain; border-radius: 5px; margin-bottom: 15px; display: block; border: 1px solid var(--border); }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option-btn { 
            background-color: #f4f4f4; border: 2px solid var(--border); padding: 15px; 
            text-align: left; border-radius: 5px; cursor: pointer; font-size: 16px; 
            transition: all 0.2s; font-family: inherit; display: flex; justify-content: space-between; align-items: center;
        }
        .option-btn:hover:not(:disabled) { background-color: #e0e0e0; border-color: #999; }
        .option-btn.correct { background-color: #d4edda; border-color: var(--correct); color: #155724; font-weight: bold; }
        .option-btn.wrong { background-color: #f8d7da; border-color: var(--wrong); color: #721c24; }
        .option-btn.selected { background-color: #fff3cd; border-color: var(--selected); font-weight: bold; }
        .option-btn:disabled { cursor: not-allowed; }
        .option-number {
            background-color: var(--selected); color: white; font-weight: bold;
            border-radius: 50%; width: 28px; height: 28px; 
            display: inline-flex; align-items: center; justify-content: center;
            margin-left: 10px; font-size: 14px;
        }
        
        .controls { margin-top: 25px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn-primary { 
            background-color: var(--primary); color: white; border: none; padding: 12px 25px; 
            border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; 
            transition: background 0.2s; font-family: inherit; 
        }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn-primary:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .progress { font-size: 14px; color: #666; margin-bottom: 10px; }
        .marathon-stats { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary); margin-bottom: 15px; font-size: 16px; }
        .result-screen { text-align: center; padding: 20px; }
        .result-screen h2 { color: var(--primary); margin-top: 0; }
        .result-score { font-size: 36px; font-weight: bold; margin: 20px 0; }
        .flashcard-reveal { margin-top: 20px; padding: 15px; background-color: #e8f4f8; border-left: 5px solid #3498db; border-radius: 5px; display: none; font-size: 16px; }
        .flashcard-reveal.show { display: block; }
        .custom-note { margin-top: 15px; font-size: 14px; color: #666; font-style: italic; background: #f9f9f9; padding: 10px; border-radius: 5px; }
        .hint { font-size: 14px; color: #666; margin-bottom: 10px; padding: 8px; background: #f0f0f0; border-radius: 5px; }
        
        .stats-card { background: #f8f9fa; border-radius: 8px; padding: 20px; margin-top: 15px; }
        .stats-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ddd; font-size: 16px; }
        .stats-row:last-child { border-bottom: none; }
        .copy-btn { margin-top: 20px; width: 100%; background-color: #3498db; }
        .copy-btn:hover { background-color: #2980b9; }
    </style>
</head>

        { id: 41, question: "Укажите Героя России подвиг которого во время проведения специальной военной операции описан ниже: «Взводу, которым командовал Герой предстояло оборонять населенный пункт на перекрестке стратегически важных дорог. Против двадцати восьми бойцов враг бросил самые беспощадные части ВСУ, включая польских наемников. Но численное превосходство не помогло врагу в течение девяти дней бойцы удерживали населенный пункт, уничтожив несколько единиц бронетехники и десятки неонацистов. В бою он потерял руку, но продолжил руководить своими бойцами до получения приказа об отходе. Во время эвакуации его БМП была подбита, но Герой сначала спас своего тяжелораненого бойца и лишь затем покинул сам горящую машину, лишившись при этом и второй руки. Жизнь Героя удалось спасти, и за все время обороны его взвод понес только одну безвозвратную потерю, хотя двадцать четыре бойца из двадцати восьми получили ранения разной степени тяжести».", options: ["Максим Владимирович Шоломов", "Головин Владислав Николаевич", "Шептухин Александр Сергеевич", "Митяшин Андрей Сергеевич"], correct: [0], image: null },

        { id: 51, question: "Какое слово пропущено в преамбуле Конституции Российской Федерации? «Мы, многонациональный народ Российской Федерации, соединенные общей судьбой на своей земле, утверждая права и свободы человека, гражданский мир и согласие, сохраняя исторически сложившееся государственное единство, исходя из общепризнанных принципов равноправия и самоопределения народов, чтя память предков, передавших нам ... и уважение к Отечеству, веру в добро и справедливость, возрождая суверенную государственность России и утверждая незыблемость ее демократической основы, стремясь обеспечить благополучие и процветание России, исходя из ответственности за свою Родину перед нынешним и будущими поколениями, сознавая себя частью мирового сообщества, принимаем КОНСТИТУЦИЮ РОССИЙСКОЙ ФЕДЕРАЦИИ».", options: ["Традиции", "Верность", "Силу", "Любовь"], correct: [3], image: null },

        { id: 61, question: "О каком Городе-герое идёт речь? «Несмотря на самые ожесточённые атаки, в которых участвовали со стороны противника около сотни танков, фашистам так и не удалось пробиться к городу ни на одном участке фронта. Только за один день защитники сумели уничтожить 31 вражеский танк и истребить много живой силы врага. После того как немцы захватили Орёл, город был переведена на военное положение. Были созданы рабочие истребительные отряды, командовали которыми герои своего города шахтёр Григорий Агеев и капитан Анатолий Горшков. Жители опоясали город лентами окопов, внутри города выкопали противотанковые рвы, установили надолбы и ежи, построили баррикады и опорные пункты. Одновременно велась активная работа по эвакуации оборонных заводов. В городе кипела жизнь. Телефонная станция помогала в налаживании связи между выбившими из окружения частями Советской Армии, госпитали принимали раненых, на заводах ремонтировалась техника и оружие, защитники города снабжались провиантом и тёплой одеждой. И город выстоял! Враг не смог его захватить».", options: ["Ленинград", "Смоленск", "Севастополь", "Тула"], correct: [3], image: null },

    function initProfile() {
        while (!userProfile || userProfile.trim() === "") {
            userProfile = prompt("Введите ваше имя или фамилию (без этого вход невозможен):");
            if (userProfile && userProfile.trim() !== "") { 
                userProfile = userProfile.trim(); 
                localStorage.setItem('userProfile', userProfile); 
            } else {
                alert("Пожалуйста, введите имя. Без имени вход на сайт запрещен.");
            }
        }

    // ==========================================
    // ОТПРАВКА В GOOGLE FORMS
    // ==========================================
    function sendFullProfile(lastModeName) {
        if (!FORM_URL || !ENTRIES.name) return;
        
        let bestExam = 0;
        if (stats.examHistory && stats.examHistory.length > 0) {
            bestExam = Math.max(...stats.examHistory.map(e => e.score));
        }
        const accuracy = stats.studyAnswered > 0 ? Math.round((stats.studyCorrect / stats.studyAnswered) * 100) : 0;
        
        const formData = new URLSearchParams();
        formData.append(ENTRIES.name, userProfile);
        formData.append(ENTRIES.bestExam, String(bestExam));
        formData.append(ENTRIES.examCount, String(stats.examHistory ? stats.examHistory.length : 0));
        formData.append(ENTRIES.marathonBest, String(stats.marathonBest || 0));
        formData.append(ENTRIES.studyCorrect, String(stats.studyCorrect || 0));
        formData.append(ENTRIES.studyTotal, String(stats.studyAnswered || 0));
        formData.append(ENTRIES.studyAccuracy, String(accuracy));
        formData.append(ENTRIES.flashcardViewed, String(stats.flashcardViewed || 0));
        formData.append(ENTRIES.lastMode, lastModeName || currentMode);
        formData.append(ENTRIES.date, new Date().toLocaleString('ru-RU'));
        
        fetch(FORM_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData.toString() })
        .then(() => console.log('✅ Отправлено в Google Forms'))
        .catch(error => console.error('❌ Ошибка:', error));
    }

    let currentMode = 'study', currentIndex = 0, studyQuestions = [], examQuestions = [], userAnswers = {}, showFlashcardAnswer = false, marathonStreak = 0, currentMarathonQ = null;
    
    // Переменные для новых режимов

    let imageQuizIndex = 0;
    let currentImageModeName = '';
    let currentImageModeKey = '';
    
    const app = document.getElementById('app');
    const btnStudy = document.getElementById('btn-study'), btnExam = document.getElementById('btn-exam'), btnFlash = document.getElementById('btn-flash'), btnMarathon = document.getElementById('btn-marathon'), btnStats = document.getElementById('btn-stats'), btnSigns = document.getElementById('btn-signs'), btnFires = document.getElementById('btn-fires'), btnKnots = document.getElementById('btn-knots');

    function setMode(mode) {
        currentMode = mode; currentIndex = 0; userAnswers = {}; showFlashcardAnswer = false; orderState = []; multiState = [];
        [btnStudy, btnExam, btnFlash, btnMarathon, btnStats, btnSigns, btnFires, btnKnots].forEach(btn => btn.classList.remove('active'));
        
        if (mode === 'study') { btnStudy.classList.add('active'); studyQuestions = shuffle([...allQuestions]); renderStudy(); } 
        else if (mode === 'exam') { btnExam.classList.add('active'); startExam(); } 
        else if (mode === 'flash') { btnFlash.classList.add('active'); renderFlashcard(); } 
        else if (mode === 'marathon') { btnMarathon.classList.add('active'); startMarathon(); } 
        else if (mode === 'signs') { btnSigns.classList.add('active'); startImageQuiz('Знаки бедствия', signsQuestions); }
        else if (mode === 'fires') { btnFires.classList.add('active'); startImageQuiz('Костры', firesQuestions); }
        else if (mode === 'knots') { btnKnots.classList.add('active'); startImageQuiz('Узлы', knotsQuestions); }
        else if (mode === 'stats') { btnStats.classList.add('active'); renderStats(); }
    }
    
    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    // --- РЕЖИМ ОБУЧЕНИЯ ---
    function renderStudy() {
        if (currentIndex >= studyQuestions.length) { 
            sendFullProfile('Обучение (завершено)');
            answersSinceSync = 0;
            app.innerHTML = `<div class="result-screen"><h2>Обучение завершено!</h2><p>Вы прошли все доступные вопросы.</p><p style="color: var(--correct); font-weight: bold;">✅ Результаты отправлены командиру</p><button class="btn-primary" onclick="setMode('study')">Начать заново</button></div>`; 
            return; 
        }
        const q = studyQuestions[currentIndex];
        let html = `<div class="progress">Вопрос ${currentIndex + 1} из ${studyQuestions.length}</div><div class="question-text">${q.question}</div>`;
        if (q.image) { html += `<img src="${q.image}" alt="Изображение" class="question-image" onerror="this.style.display='none'">`; }
        
        if (q.type === 'order') {
            html += `<div class="hint">Нажимайте на варианты в правильном порядке. Цифры покажут ваш выбор.</div>`;
            html += `<div class="options" id="options-container">`;
            q.options.forEach((opt, index) => { 
                html += `<button class="option-btn" id="opt-${index}" onclick="selectOrderAnswer(${index})">${opt}<span class="option-number" style="display:none;"></span></button>`; 
            });
            html += `</div><div class="controls"><button class="btn-primary" id="check-order-btn" style="display:none;" onclick="checkOrderAnswer()">Проверить</button></div>`;
        } else if (q.type === 'multi') {
            html += `<div class="hint">Выберите все правильные варианты, затем нажмите «Проверить».</div>`;
            html += `<div class="options" id="options-container">`;
            q.options.forEach((opt, index) => { 
                html += `<button class="option-btn" id="opt-${index}" onclick="toggleMultiAnswer(${index})">${opt}</button>`; 
            });
            html += `</div><div class="controls"><button class="btn-primary" id="check-multi-btn" onclick="checkMultiAnswer()">Проверить</button></div>`;
        } else {
            html += `<div class="options">`;
            q.options.forEach((opt, index) => { 
                html += `<button class="option-btn" onclick="checkStudyAnswer(${index}, ${JSON.stringify(q.correct)})">${opt}</button>`; 
            });
            html += `</div>`;
            if (q.customNote) { html += `<div class="custom-note">${q.customNote}</div>`; }
            html += `<div class="controls"><button class="btn-primary" id="next-btn" style="display:none;" onclick="nextStudyQuestion()">Следующий вопрос →</button></div>`;
        }
        app.innerHTML = html;
    }
    
    // Логика для order
    function selectOrderAnswer(index) {
        const btn = document.getElementById(`opt-${index}`);
        const numberSpan = btn.querySelector('.option-number');
        
        if (orderState.includes(index)) {
            orderState = orderState.filter(i => i !== index);
            numberSpan.style.display = 'none';
            numberSpan.innerText = '';
        } else {
            if (orderState.length >= 4) return;
            orderState.push(index);
            numberSpan.innerText = orderState.length;
            numberSpan.style.display = 'inline-flex';
        }
        
        // Пересчет номеров
        orderState.forEach((idx, i) => {
            const b = document.getElementById(`opt-${idx}`);
            b.querySelector('.option-number').innerText = i + 1;
        });
        
        document.getElementById('check-order-btn').style.display = orderState.length === 4 ? 'block' : 'none';
    }

    function checkOrderAnswer() {
        const q = studyQuestions[currentIndex];
        document.getElementById('check-order-btn').style.display = 'none';
        
        const isCorrect = JSON.stringify(orderState) === JSON.stringify(q.correct);
        
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
        
        // Показать правильный порядок
        q.options.forEach((opt, index) => {
            const btn = document.getElementById(`opt-${index}`);
            const numSpan = btn.querySelector('.option-number');
            const correctPos = q.correct.indexOf(index);
            if (correctPos !== -1) {
                btn.classList.add('correct');
                numSpan.innerText = correctPos + 1;
                numSpan.style.display = 'inline-flex';
                numSpan.style.backgroundColor = 'var(--correct)';
            } else if (orderState.includes(index)) {
                btn.classList.add('wrong');
            }
        });

        if (isCorrect) {
            stats.studyAnswered++; stats.studyCorrect++; answersSinceSync++; saveStats();
            setTimeout(() => { nextStudyQuestion(); }, 1500);
        } else {
            stats.studyAnswered++; saveStats();
            const controls = document.querySelector('.controls');
            const btn = document.createElement('button');
            btn.className = 'btn-primary';
            btn.innerText = 'Продолжить';
            btn.onclick = () => nextStudyQuestion();
            controls.appendChild(btn);
        }
    }

    // Логика для multi
    function toggleMultiAnswer(index) {
        const btn = document.getElementById(`opt-${index}`);
        if (multiState.includes(index)) {
            multiState = multiState.filter(i => i !== index);
            btn.classList.remove('selected');
        } else {
            multiState.push(index);
            btn.classList.add('selected');
        }
    }

    function checkMultiAnswer() {
        const q = studyQuestions[currentIndex];
        document.getElementById('check-multi-btn').style.display = 'none';
        
        const correctArray = q.correct;
        const isCorrect = correctArray.every(val => multiState.includes(val)) && multiState.length === correctArray.length;
        
        document.querySelectorAll('.option-btn').forEach((btn, index) => {
            btn.disabled = true;
            if (correctArray.includes(index)) btn.classList.add('correct');
            if (!isCorrect && multiState.includes(index) && !correctArray.includes(index)) btn.classList.add('wrong');
        });

        if (isCorrect) {
            stats.studyAnswered++; stats.studyCorrect++; answersSinceSync++; saveStats();
            setTimeout(() => { nextStudyQuestion(); }, 1200);
        } else {
            stats.studyAnswered++; saveStats();
            const controls = document.querySelector('.controls');
            const btn = document.createElement('button');
            btn.className = 'btn-primary';
            btn.innerText = 'Продолжить';
            btn.onclick = () => nextStudyQuestion();
            controls.appendChild(btn);
        }
    }
    
    function checkStudyAnswer(selectedIndex, correctIndices) {
        const buttons = document.querySelectorAll('.option-btn'); 
        const isCorrect = correctIndices.includes(selectedIndex);
        stats.studyAnswered++; 
        if (isCorrect) { stats.studyCorrect++; answersSinceSync++; }
        saveStats();
        
        buttons.forEach((btn, index) => { 
            btn.disabled = true; 
            if (correctIndices.includes(index)) { btn.classList.add('correct'); } 
            else if (index === selectedIndex) { btn.classList.add('wrong'); } 
        });

        if (answersSinceSync >= 25) { answersSinceSync = 0; sendFullProfile('Обучение (в процессе)'); }
        
        if (isCorrect) { 
            setTimeout(() => { nextStudyQuestion(); }, 800); 
        } else { 
            document.getElementById('next-btn').style.display = 'block'; 
        }
    }
    
    function nextStudyQuestion() { 
        currentIndex++; 
        orderState = []; multiState = []; 
        renderStudy(); 
    }

    // --- НОВЫЕ РЕЖИМЫ (Знаки, Костры, Узлы) ---
    function startImageQuiz(modeName, questionsArray) {
        currentImageModeName = modeName;
        if (modeName === 'Знаки бедствия') currentImageModeKey = 'signs';
        else if (modeName === 'Костры') currentImageModeKey = 'fires';
        else currentImageModeKey = 'knots';
        
        imageQuizQuestions = shuffle([...questionsArray]);
        imageQuizIndex = 0;
        renderImageQuiz();
    }

    function renderImageQuiz() {
        if (imageQuizQuestions.length === 0) {
            app.innerHTML = `<div class="result-screen"><h2>Режим в разработке</h2><p>Скоро здесь появятся вопросы!</p><button class="btn-primary" onclick="setMode('study')">Вернуться</button></div>`;
            return;
        }
        
        if (imageQuizIndex >= imageQuizQuestions.length) {
            app.innerHTML = `<div class="result-screen">
                <h2>✅ Режим "${currentImageModeName}" пройден!</h2>
                <p>Вы ответили на все ${imageQuizQuestions.length} вопросов.</p>
                <button class="btn-primary" onclick="setMode('${currentImageModeKey}')" style="margin-top:20px;">Пройти заново</button>
                <button class="btn-primary" onclick="setMode('study')" style="margin-top:10px; background-color: #666;">В главное меню</button>
            </div>`;
            return;
        }
        
        const q = imageQuizQuestions[imageQuizIndex];
        let html = `<div class="progress">Режим: ${currentImageModeName} — Вопрос ${imageQuizIndex + 1} из ${imageQuizQuestions.length}</div><div class="question-text">${q.question}</div>`;
        if (q.image) { html += `<img src="${q.image}" alt="Изображение" class="question-image" onerror="this.style.display='none'">`; }
        html += `<div class="options">`;
        q.options.forEach((opt, index) => { 
            html += `<button class="option-btn" onclick="checkImageQuizAnswer(${index}, ${q.correct})">${opt}</button>`; 
        });
        html += `</div><div class="controls"><button class="btn-primary" id="next-image-btn" style="display:none;" onclick="nextImageQuestion()">Следующий вопрос →</button></div>`;
        app.innerHTML = html;
    }

    function checkImageQuizAnswer(selectedIndex, correctIndex) {
        const buttons = document.querySelectorAll('.option-btn');
        const isCorrect = selectedIndex === correctIndex;
        
        buttons.forEach((btn, index) => {
            btn.disabled = true;
            if (index === correctIndex) btn.classList.add('correct');
            else if (index === selectedIndex) btn.classList.add('wrong');
        });

        if (isCorrect) {
            setTimeout(() => {
                imageQuizIndex++;
                renderImageQuiz();
            }, 800);
        } else {
            document.getElementById('next-image-btn').style.display = 'block';
        }
    }

    function nextImageQuestion() {
        imageQuizIndex++;
        renderImageQuiz();
    }

    // --- РЕЖИМ ЭКЗАМЕНА ---
    function startExam() { const shuffled = shuffle([...allQuestions]); examQuestions = shuffled.slice(0, Math.min(20, shuffled.length)); currentIndex = 0; renderExam(); }
    
    function renderExam() {
        if (currentIndex >= examQuestions.length) { renderExamResults(); return; }
        const q = examQuestions[currentIndex];
        let html = `<div class="progress">Вопрос ${currentIndex + 1} из ${examQuestions.length}</div><div class="question-text">${q.question}</div>`;
        if (q.image) { html += `<img src="${q.image}" alt="Изображение" class="question-image" onerror="this.style.display='none'">`; }
        html += `<div class="options">`;
        q.options.forEach((opt, index) => { 
            const isSelected = userAnswers[q.id] && userAnswers[q.id].includes(index); 
            const checked = isSelected ? 'style="border-color: var(--primary); background-color: #eef2ed;"' : ''; 
            html += `<button class="option-btn" ${checked} onclick="selectExamAnswer(${index})">${opt}</button>`; 
        });
        html += `</div><div class="controls"><button class="btn-primary" id="exam-next-btn" onclick="nextExamQuestion()">${currentIndex === examQuestions.length - 1 ? 'Завершить тест' : 'Следующий вопрос →'}</button></div>`;
        app.innerHTML = html;
    }
    
    function selectExamAnswer(index) {
        const q = examQuestions[currentIndex]; if (!userAnswers[q.id]) { userAnswers[q.id] = []; }
        if (userAnswers[q.id].includes(index)) { userAnswers[q.id] = userAnswers[q.id].filter(i => i !== index); } else { userAnswers[q.id].push(index); }
        if (q.correct.length === 1 && userAnswers[q.id].length > 1) { userAnswers[q.id] = [index]; }
        renderExam(); 
    }
    
    function nextExamQuestion() { currentIndex++; renderExam(); }
    
    function renderExamResults() {
        let correctCount = 0;
        examQuestions.forEach(q => { 
            const userAnswer = userAnswers[q.id] || []; 
            const correctArray = q.correct; 
            const isCorrect = userAnswer.length === correctArray.length && userAnswer.every(val => correctArray.includes(val)); 
            if (isCorrect) { correctCount++; } 
        });
        const score = Math.round((correctCount / examQuestions.length) * 100);
        stats.examHistory.push({ date: new Date().toLocaleDateString('ru-RU'), score: score, total: examQuestions.length, correct: correctCount }); 
        saveStats();
        sendFullProfile('Экзамен');
        
        let grade = "2"; if (score >= 80) grade = "5"; else if (score >= 60) grade = "4"; else if (score >= 40) grade = "3";
        app.innerHTML = `<div class="result-screen"><h2>Экзамен завершен!</h2><div class="result-score" style="color: ${score >= 60 ? 'var(--correct)' : 'var(--wrong)'}">${correctCount} / ${examQuestions.length} (${score}%)</div><p>Ваша оценка: <strong>${grade}</strong></p><p style="color: var(--correct); font-weight: bold;">✅ Результаты отправлены командиру</p><button class="btn-primary" onclick="setMode('exam')" style="margin-top:20px;">Пройти еще раз</button><button class="btn-primary" onclick="setMode('study')" style="margin-top:20px; background-color: #666;">В режим обучения</button></div>`;
    }

    // --- РЕЖИМ ФЛЕШ-КАРТ ---
    function renderFlashcard() {
        const q = allQuestions[Math.floor(Math.random() * allQuestions.length)]; stats.flashcardViewed++; saveStats();
        let html = `<div class="progress">Режим повторения</div><div class="question-text">${q.question}</div>`;
        if (q.image) { html += `<img src="${q.image}" alt="Изображение" class="question-image" onerror="this.style.display='none'">`; }
        let correctAnswersText = q.correct.map(idx => q.options[idx]).join(', ');
        if (q.customNote) { correctAnswersText += `<br><br><small>${q.customNote}</small>`; }
        html += `<div class="flashcard-reveal ${showFlashcardAnswer ? 'show' : ''}"><strong>Правильный ответ:</strong><br>${correctAnswersText}</div><div class="controls"><button class="btn-primary" onclick="toggleFlashcard()">${showFlashcardAnswer ? 'Скрыть ответ' : 'Показать ответ'}</button><button class="btn-primary" style="background-color: #666;" onclick="nextFlashcard()">Следующая карточка →</button></div>`;
        app.innerHTML = html;
    }
    function toggleFlashcard() { showFlashcardAnswer = !showFlashcardAnswer; renderFlashcard(); }
    function nextFlashcard() { showFlashcardAnswer = false; renderFlashcard(); }

    // --- РЕЖИМ МАРАФОН ---
    function startMarathon() { marathonStreak = 0; nextMarathonQuestion(); }
    function nextMarathonQuestion() { currentMarathonQ = allQuestions[Math.floor(Math.random() * allQuestions.length)]; renderMarathon(); }
    
    function renderMarathon() {
        if (!currentMarathonQ) return;
        let html = `<div class="progress">🏆 Марафон на выживание</div><div class="marathon-stats"><span>Текущая серия: ${marathonStreak}</span><span>Личный рекорд: ${stats.marathonBest}</span></div><div class="question-text">${currentMarathonQ.question}</div>`;
        if (currentMarathonQ.image) { html += `<img src="${currentMarathonQ.image}" alt="Изображение" class="question-image" onerror="this.style.display='none'">`; }
        html += `<div class="options">`;
        currentMarathonQ.options.forEach((opt, index) => { html += `<button class="option-btn" onclick="checkMarathonAnswer(${index}, ${JSON.stringify(currentMarathonQ.correct)})">${opt}</button>`; });
        html += `</div><div class="controls" id="marathon-controls" style="display:none;"><button class="btn-primary" onclick="startMarathon()">Начать заново</button></div>`;
        app.innerHTML = html;
    }
    
    function checkMarathonAnswer(selectedIndex, correctIndices) {
        const buttons = document.querySelectorAll('.option-btn'); const isCorrect = correctIndices.includes(selectedIndex);
        buttons.forEach((btn, index) => { btn.disabled = true; if (correctIndices.includes(index)) { btn.classList.add('correct'); } else if (index === selectedIndex) { btn.classList.add('wrong'); } });
        if (isCorrect) { marathonStreak++; if (marathonStreak > stats.marathonBest) { stats.marathonBest = marathonStreak; saveStats(); } setTimeout(() => { nextMarathonQuestion(); }, 800); } 
        else { sendFullProfile('Марафон'); const progressDiv = document.querySelector('.progress'); progressDiv.innerHTML = `❌ Игра окончена! Вы ответили правильно ${marathonStreak} раз подряд.`; document.getElementById('marathon-controls').style.display = 'block'; }
    }

    // --- РЕЖИМ СТАТИСТИКИ ---
    function renderStats() {
        initProfile();
        let examInfo = "Нет данных";
        if (stats.examHistory.length > 0) { const last = stats.examHistory[stats.examHistory.length - 1]; const best = Math.max(...stats.examHistory.map(e => e.score)); examInfo = `Последний: ${last.score}% (${last.correct}/${last.total})<br>Лучший: ${best}%`; }
        let studyAccuracy = "0%"; if (stats.studyAnswered > 0) { studyAccuracy = Math.round((stats.studyCorrect / stats.studyAnswered) * 100) + "%"; }
        
        let html = `<h2 style="text-align:center; color: var(--primary); margin-top:0;">📊 Статистика бойца</h2><div style="text-align:center; font-size: 20px; font-weight: bold; margin-bottom: 20px;">${userProfile}</div><div class="stats-card"><div class="stats-row"><span>🏆 Рекорд в Марафоне:</span><strong>${stats.marathonBest} правильных подряд</strong></div><div class="stats-row"><span>📝 Экзамены:</span><strong style="text-align:right;">${examInfo}</strong></div><div class="stats-row"><span>📖 Обучение (всего ответов):</span><strong>${stats.studyAnswered}</strong></div><div class="stats-row"><span>🎯 Точность в обучении:</span><strong>${studyAccuracy}</strong></div><div class="stats-row"><span>🔄 Просмотрено флеш-карт:</span><strong>${stats.flashcardViewed}</strong></div></div>
        <button class="btn-primary copy-btn" onclick="sendFullProfile('Профиль (вручную)')" style="background-color: #27ae60; font-size: 16px;">📤 Отправить результаты командиру</button>
        <button class="btn-primary copy-btn" onclick="copyReport()">📋 Скопировать отчет вручную</button><button class="btn-primary" style="margin-top:10px; background-color: #e74c3c; width:100%;" onclick="resetStats()">Сбросить мою статистику</button>`;
        app.innerHTML = html;
    }
    
    function copyReport() {
        const text = `Боец: ${userProfile}. Рекорд Марафона: ${stats.marathonBest}. Экзамены: ${stats.examHistory.length > 0 ? 'Лучший ' + Math.max(...stats.examHistory.map(e => e.score)) + '%' : 'не проходил'}. Обучение: ${stats.studyCorrect}/${stats.studyAnswered} (${stats.studyAnswered > 0 ? Math.round((stats.studyCorrect / stats.studyAnswered) * 100) : 0}%).`;
        navigator.clipboard.writeText(text).then(() => { alert("Отчет скопирован!"); }).catch(err => { alert("Ошибка копирования."); });
    }
    
    function resetStats() {
        if (confirm("Сбросить статистику?")) { stats = { marathonBest: 0, examHistory: [], studyAnswered: 0, studyCorrect: 0, flashcardViewed: 0 }; saveStats(); renderStats(); }
    }

    // Инициализация
    initProfile();
    setMode('study');
</script>
</body>
</html>
